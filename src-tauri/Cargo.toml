[package]
name = "dayz-launcher"
version = "0.1.65"
description = "Windows DayZ Standalone launcher: server browser, mod sync, direct launch"
authors = ["DayZ Launcher contributors"]
edition = "2021"
rust-version = "1.98"

[lib]
# Distinct lib name avoids a Windows bin/lib artifact clash (rust-lang/cargo#8519).
name = "dayz_launcher_lib"
# Desktop only: a plain rlib is all the bin needs; cdylib/staticlib would only add link time.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56.0"
keyvalues-parser = "0.2.4"
# Without the default `unstable_admin` feature, which on a refused reparse point enables
# SeBackupPrivilege or SeRestorePrivilege on the whole process token when it runs
# elevated (D-120) - for the rest of the run, where any file open could then pass over
# ACLs. Our junctions live in the user's own game folder; a refusal there is a refusal
# (junction 2.0.0 internals/helpers.rs, D-282).
junction = { version = "2.0.0", default-features = false }
thiserror = "2.0.20"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # The window's icons from the exe's icon group at its DPI (D-264).
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    # This PC's threads and memory for the launch's performance arguments (D-267).
    "Win32_System_SystemInformation",
] }
# The GPU's dedicated memory through DXGI (D-267); tauri already builds this version.
windows = { version = "0.61.3", features = ["Win32_Graphics_Dxgi"] }
tokio = { version = "1.53.1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
# DZSA server-list fallback when Steam is unavailable (D-089); the updater already pulls this version.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
steamworks = { version = "0.13.1", features = ["raw-bindings"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-notification = "2.4.0"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.5"
# News thumbnails (D-111): Steam's clan-image CDN serves 3840×2160 pictures and ignores resize parameters.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

# docs/05-architecture-and-optimisation.md §7 (Rust)
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
debug = false
incremental = false
