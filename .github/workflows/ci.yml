# Continuous checks on every push and pull request (D-071): the same gates that run
# locally before a commit. Windows only, like the app.
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned (D-194)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, pinned (D-194)
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check the frontend
        run: npm run check

      - name: Build the frontend
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust unit tests
        run: cargo test
        working-directory: src-tauri

      - name: NSIS template matches upstream
        run: node tools/nsis_template_check.js

      # An unparseable workflow fails in 0 s with no log and no explanation, so CI has
      # to be the thing that notices (D-228).
      - name: Workflows parse
        run: node tools/workflow_check.js
