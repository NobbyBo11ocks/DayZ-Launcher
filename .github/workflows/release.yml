# Builds, signs and publishes a release when a `v<version>` tag is pushed (D-071).
# Only from a commit whose CI passed. The release is created as a draft and made public
# only after the smoke test has passed and the final manifest has been written and its
# signature checked against the app's public key (D-241, D-279). Manual runs build,
# smoke-test and check the signature, and publish nothing: a manual publishing run
# skipped the tag-version check and could replace a shipped release's installer with a
# build of main.
#
# Required repository secret:
#   TAURI_SIGNING_PRIVATE_KEY          content of the minisign private key
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD is optional and deliberately unset: our key has
# no password and the build passes `--ci`, so the CLI never prompts. A missing secret
# resolves to an empty string below, which is what the CLI expects (D-145).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The CI gate below reads this commit's CI run (D-279).
  actions: read

# One queue for every tag, in order. A group per tag let two releases run side by side,
# and whichever published last became `latest`, whatever its version; `queue: max`
# keeps a third tag waiting instead of cancelling the second (D-279).
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, pinned (D-245)

      # This job runs neither clippy nor the tests, so a tag on a commit whose CI failed,
      # was cancelled or never ran published anyway; only the local release script
      # stood in the way (D-269). A tag pushed while CI is still running waits for it.
      - name: CI passed on this commit
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $start = Get-Date
          while ($true) {
            $json = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --limit 1 --json status,conclusion,databaseId
            if ($LASTEXITCODE -ne 0) { throw "could not read the CI runs of $env:GITHUB_SHA" }
            $run = $json | ConvertFrom-Json | Select-Object -First 1
            if ($run -and $run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') { throw "CI run $($run.databaseId) on $env:GITHUB_SHA ended '$($run.conclusion)'; not releasing it" }
              "CI run $($run.databaseId) on $env:GITHUB_SHA passed"
              break
            }
            $waited = ((Get-Date) - $start).TotalMinutes
            if (-not $run -and $waited -gt 3) { throw "no CI run for $env:GITHUB_SHA: tag a commit that was pushed to main and passed CI" }
            if ($waited -gt 30) { throw "CI on $env:GITHUB_SHA did not finish within 30 minutes" }
            Start-Sleep -Seconds 20
          }

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, pinned (D-245)
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned (D-194)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, pinned (D-194)
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: NSIS template matches upstream
        run: node tools/nsis_template_check.js

      # All three version fields, not just the one Tauri reads. Cargo.toml drifted four
      # versions behind unnoticed, and CARGO_PKG_VERSION is what `app_info` shows in
      # Settings, what the first line of every support log says, and what the Steam news
      # User-Agent claims (D-221).
      # The tag name reaches every script through the environment, never by
      # interpolation into the script's source: git allows `$`, `(` and `'` in a ref,
      # which PowerShell would have run with the signing key in scope (D-245).
      - name: Tag must match the configured version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoLine = Get-Content src-tauri/Cargo.toml | Where-Object { $_ -like 'version = *' } | Select-Object -First 1
          $cargo = ($cargoLine -split '"')[1]
          $tag = $env:TAG
          if ($tag -ne "v$version") { throw "tag $tag does not match tauri.conf.json version $version" }
          if ($pkg -ne $version) { throw "package.json is $pkg but tauri.conf.json is $version" }
          if ($cargo -ne $version) { throw "src-tauri/Cargo.toml is $cargo but tauri.conf.json is $version" }
          "tag $tag matches all three version fields ($version)"

      # The updater config carries a public key, so every build (dry runs too) must sign.
      - name: Signing key is configured
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: if (-not $env:KEY) { throw "repository secret TAURI_SIGNING_PRIVATE_KEY is not set (see README, Releasing through GitHub Actions)" }

      # A re-run of a published tag's workflow would rebuild the installer and replace the
      # shipped one under the old manifest's signature until the rewrite step ran — every
      # install checking in those minutes failed verification. Publish once (D-246).
      - name: Refuse to rebuild a published release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $draft = gh release view $env:TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'false') { throw "release $env:TAG is already published; a re-run would replace its installer" }
          exit 0

      # Builds the signed NSIS installer; when publishing, also creates the release
      # and uploads the installer, its .sig and latest.json (asset names rewritten
      # the way GitHub does it).
      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1, pinned (D-194)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.PUBLISH == 'true' && 'v__VERSION__' || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && 'v__VERSION__' || '' }}
          releaseBody: |
            Existing installs offer this update in Settings and in the side rail (they check at start-up and when their window comes back into focus, at most once a day); it installs with one click.
            The installer is not code-signed yet, so Windows SmartScreen shows an "unknown publisher" warning on first run: choose "More info", then "Run anyway".
          generateReleaseNotes: ${{ env.PUBLISH == 'true' }}
          # A draft until the smoke test below has passed: published here, a build that
          # failed it was already `releases/latest` and every install offered it (D-241).
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: ${{ env.PUBLISH == 'true' }}
          uploadWorkflowArtifacts: ${{ env.PUBLISH != 'true' }}
          args: --ci

      # A clean Windows image without Steam or DayZ: the installer must land in the
      # per-user Programs folder, the app must start and stay up, and the uninstaller
      # must leave nothing behind.
      - name: Smoke-install on the runner
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no installer built' }
          "installer: $($setup.Name) ($($setup.Length) bytes)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          # Never hard-code the product name again: the rename to "DZSA CrayZ Launcher"
          # moved the install folder and the uninstall key, this step threw, and the
          # manifest rewrite below was skipped (D-160).
          $product = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          $dir = Join-Path $env:LOCALAPPDATA "Programs\$product"
          foreach ($f in 'dayz-launcher.exe', 'steam_api64.dll', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f in $dir" }
          }
          $key = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$product"
          "installed $($key.DisplayVersion) at $($key.InstallLocation)"
          $app = Start-Process -FilePath (Join-Path $dir 'dayz-launcher.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "app exited within 15 s with code $($app.ExitCode)" }
          # Still running is not the same as started: a failed start stops on its fatal
          # dialog (D-194) and waits there for a click nobody makes on a runner (D-241).
          $app.Refresh()
          if ($app.MainWindowTitle -like '*could not start*') { throw "the app is showing its fatal-error dialog" }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $log = Join-Path $env:LOCALAPPDATA 'com.dayzlauncher.desktop\logs\launcher.log'
          if (-not (Test-Path $log)) { throw "no launcher.log after 15 s" }
          $text = Get-Content $log -Raw
          if ($text -match 'ERROR\s+app\s+panic:') { throw "the app panicked: $($Matches[0])" }
          if ($text -notmatch "start v$([regex]::Escape($version))") { throw "launcher.log has no 'start v$version' line" }
          "app running after 15 s (pid $($app.Id)), started v$version; stopping it"
          # The whole tree, not just the parent. Tauri's WebView2 children outlive a
          # kill of the host process and hold the install directory open, which is what
          # left dayz-launcher.exe and steam_api64.dll behind for the uninstaller on
          # v0.1.26 and v0.1.27 — still there after 120 s, so it was never a race (D-196).
          Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $app.Id -Force
          $gone = (Get-Date).AddSeconds(30)
          while ((Get-Process -Name dayz-launcher -ErrorAction SilentlyContinue) -and (Get-Date) -lt $gone) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          # The uninstaller's contract is the registry entry and the files; NSIS copies
          # itself to %TEMP% and keeps deleting after its parent returns, so both are
          # polled rather than read once.
          $binaries = 'dayz-launcher.exe', 'steam_api64.dll'
          function Remaining { @(Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -in $binaries }) }
          $deadline = (Get-Date).AddSeconds(120)
          while ((Remaining).Count -gt 0 -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$product" -ErrorAction SilentlyContinue) {
            throw "uninstall left its Add/Remove Programs entry behind"
          }
          $exe = Remaining
          if ($exe.Count -gt 0) {
            # Name the holder instead of guessing: this is the evidence the last two
            # failures did not have.
            "still present: $($exe.Name -join ', ')"
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and $_.Path.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) } |
              Select-Object Id, ProcessName, Path | Format-Table -AutoSize | Out-String | Write-Host
            throw "uninstall left the app behind after 120 s: $($exe.Name -join ', ')"
          }
          if (Test-Path $dir) {
            $left = @(Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue)
            "uninstall clean; $($left.Count) non-binary file(s) left: $(($left | Select-Object -First 5).Name -join ', ')"
          } else {
            "uninstall clean"
          }

      # The manifest is written and checked before anything is public (D-279). The Tauri
      # CLI only warns when the signing key does not match the app's public key (tauri-cli
      # 2.11.5, bundle.rs), so a wrong key built, passed the smoke test and was published,
      # and only the check after publishing noticed, with the release already `latest` and
      # refused by every install. tauri-action's own manifest points at an api.github.com
      # asset URL, which counts against GitHub's unauthenticated rate limit (D-147); ours
      # is built from the tag, so it is final while the release is still a draft. The
      # check reads the installer on disk against the public key the app ships with.
      - name: Write the manifest and check its signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:PUBLISH -eq 'true') { node tools/make_latest.js $env:TAG } else { node tools/make_latest.js --offline }
          if ($LASTEXITCODE -ne 0) { throw 'make_latest.js failed' }
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          node tools/verify_update_sig.js src-tauri/target/release/bundle/nsis/latest.json --installer $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'the manifest or its signature did not verify; nothing is published' }

      - name: Upload the manifest to the draft
        if: success() && env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload $env:TAG 'src-tauri/target/release/bundle/nsis/latest.json' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'could not upload latest.json to the draft' }

      # Only now does the release become `releases/latest` (D-241), and never over a newer
      # one: the queue keeps tags in order, but a re-run of an older tag's failed run
      # would otherwise take `latest` back (D-279).
      - name: Publish the release
        if: success() && env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $latest = gh release view --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0 -and $latest) {
            if ([version]$latest.TrimStart('v') -ge [version]$env:TAG.TrimStart('v')) { throw "$latest is the latest release; $env:TAG must not replace it" }
          }
          gh release edit $env:TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "could not publish $env:TAG" }

      - name: Verify the published manifest and signature
        if: success() && env.PUBLISH == 'true'
        shell: pwsh
        run: |
          # The verifier now also requires the manifest and its signed comment to name
          # this release's version, so a cached copy of the previous manifest — which
          # GitHub serves for minutes after a release (D-147) — is waited out instead of
          # passing on the first attempt (D-240). Twelve attempts: four minutes.
          $ok = $false
          foreach ($attempt in 1..12) {
            node tools/verify_update_sig.js
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            "attempt $attempt failed; waiting for the release assets to propagate"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { throw 'the published manifest did not verify' }

      # A run that failed before publishing leaves a draft carrying an installer that
      # never passed the smoke test and a manifest that was never checked; published by
      # hand it would skip both gates. The draft goes, the tag stays (D-245). Cancelled
      # runs too, the 60-minute timeout included: `failure()` is false for those, and
      # their drafts stayed (D-279).
      - name: Delete the unpublished draft of a failed run
        if: (failure() || cancelled()) && env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $draft = gh release view $env:TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -ne 0) { "no release exists for $env:TAG"; exit 0 }
          if ($draft -ne 'true') { "$env:TAG is published; nothing to delete"; exit 0 }
          gh release delete $env:TAG --yes
          if ($LASTEXITCODE -ne 0) { throw "could not delete the draft release $env:TAG" }
          "deleted the draft release $env:TAG"
